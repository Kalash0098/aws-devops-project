apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-devops-app
  template:
    metadata:
      labels:
        app: aws-devops-app
    spec:
      containers:
      - name: aws-devops-app
        image: kalash655/aws-devops-project:latest
        ports:
          - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
